name: Android app

# Builds the Android app (Strand-<version>.apk). It is a thin shell that opens
# https://kat-heu.github.io/strand/ full-screen, so the app updates whenever the
# website does; a new APK is only needed if this shell itself changes.
#
# Signing: add two repository secrets so every build is signed with the same key
# (Android only installs an update over an app signed with the same key):
#   ANDROID_KEYSTORE_B64       the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
# Without them the build still works but uses a throwaway key.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Release tag to attach the APK to (e.g. v0.1.10)
        type: string
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Version
        run: |
          V=$(node -p "require('./package.json').version")
          IFS=. read -r MA MI PA <<< "$V"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MA * 1000000 + MI * 1000 + PA))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEY="$RUNNER_TEMP/strand.keystore"
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > "$KEY"
            echo "::add-mask::$KP"
            PASS="$KP"
          else
            PASS="throwaway-$(openssl rand -hex 12)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KEY" -storepass "$PASS" -keypass "$PASS" -alias strand \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Strand" -noprompt
            echo "::warning::No ANDROID_KEYSTORE secrets set, so this APK is signed with a throwaway key."
          fi
          echo "KEYSTORE_FILE=$KEY" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          FP=$(keytool -list -v -keystore "$KEY" -storepass "$PASS" -alias strand | sed -n 's/.*SHA256: //p')
          {
            echo "### Signing certificate SHA-256"
            echo '`'"$FP"'`'
            echo
            echo "For a full-screen app (no address bar), publish this as https://kat-heu.github.io/.well-known/assetlinks.json:"
            echo '```json'
            echo "[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"android_app\",\"package_name\":\"app.strand.player\",\"sha256_cert_fingerprints\":[\"$FP\"]}}]"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; then
            # Surface the reason as an annotation so it's visible without opening the log.
            MSG=$(grep -A25 "What went wrong" build.log | head -40)
            [ -n "$MSG" ] || MSG=$(tail -40 build.log)
            MSG="${MSG//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"
            echo "::error title=Android build failed::$MSG"
            exit 1
          fi

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk "Strand-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: strand-android
          path: Strand-*.apk

      - name: Attach to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" Strand-*.apk --clobber --repo "$GITHUB_REPOSITORY"
