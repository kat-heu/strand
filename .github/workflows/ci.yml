name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # tests run the web app; no Electron needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: npm test
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            # Show which checks failed as annotations (visible without opening the log).
            grep -E "^(FAIL|CRASH)" test.log | head -10 | while read -r l; do echo "::error title=Test failed::${l//$'\n'/ }"; done
            exit 1
          fi

  desktop:
    # Runs the real desktop app (Electron) to check the parts the browser tests can't:
    # playing songs from files on the computer (iTunes library).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Desktop app check
        run: |
          set -o pipefail
          if ! xvfb-run -a npx electron --no-sandbox tests/electron/smoke.js 2>&1 | tee smoke.log; then
            grep -E "^(FAIL|CRASH)" smoke.log | head -10 | while read -r l; do echo "::error title=Desktop check failed::$l"; done
            exit 1
          fi

