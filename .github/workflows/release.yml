name: Build desktop apps

# Builds Windows (.exe), macOS (.dmg) and Linux (.AppImage) installers and
# publishes them as a GitHub Release named after the version in package.json.
#
# Runs on every push to main, but only builds when that version has no
# published release yet. To ship a new version, bump "version" in
# package.json and push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          DRAFT=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "v$V is already released — nothing to build."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          if [ "$DRAFT" = "none" ]; then
            # Create the draft once, so the three parallel builds upload into the same release.
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Strand $V" --notes-file - <<'NOTES'
          ## Download

          | System | File |
          |---|---|
          | **Windows** | `Strand-Setup-*.exe` |
          | **macOS** | `Strand-*.dmg` |
          | **Linux** | `Strand-*.AppImage` |
          | **Android** | `Strand-*.apk` |

          These builds aren't code-signed yet, so the first launch shows a warning:
          - **Windows:** "Windows protected your PC" → **More info** → **Run anyway**.
          - **macOS:** right-click the app → **Open** → **Open**.
          - **Linux:** make the AppImage executable (`chmod +x`), then run it.
          - **Android:** open the .apk on your phone and allow "Install unknown apps" for your browser when asked.

          **iPhone:** open https://kat-heu.github.io/strand/strand.mobileconfig in Safari → **Allow**, then Settings app → **Profile Downloaded** → **Install**.

          Full-length Spotify and Apple Music playback in the desktop app needs the Widevine-enabled Electron build (see README). YouTube, SoundCloud and previews work out of the box.
          NOTES
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # Widevine production signing (castLabs EVS) for Windows and macOS — needed for
      # Spotify inside the desktop app. Optional: without the secrets the build still
      # works with castLabs' development signature.
      - uses: actions/setup-python@v5
        if: matrix.os != 'ubuntu-latest'
        with:
          python-version: '3.12'
      - name: Log in to castLabs EVS
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          python -m pip install --upgrade castlabs-evs
          if [ -n "$EVS_ACCOUNT_NAME" ] && [ -n "$EVS_PASSWD" ]; then
            python -m castlabs_evs.account -n reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD" && echo "EVS_LOGGED_IN=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No EVS_ACCOUNT_NAME / EVS_PASSWD secrets: the desktop app keeps castLabs' development Widevine signature."
          fi
      - name: Build installers and upload to the release
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --publish always 2>&1 | tee build.log; then
            grep -iE "error|failed|cannot|⨯" build.log | grep -v "^\s*at " | tail -8 | while read -r l; do echo "::error title=Build failed::$l"; done
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds; add signing certificates later
          EVS_PYTHON: python
      - uses: actions/upload-artifact@v4
        with:
          name: strand-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore

  android:
    needs: check
    if: needs.check.outputs.needed == 'true'
    uses: ./.github/workflows/android.yml
    with:
      release: v${{ needs.check.outputs.version }}
    secrets: inherit

  publish:
    needs: [check, build, android]
    # Publish as long as the Windows installer made it (a macOS/Linux/Android hiccup
    # shouldn't hold back updates for everyone else).
    if: always() && needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.check.outputs.version }}"
          # Fixed-name copies, so the README's download links always get the newest version.
          # (The auto-updater keeps using the versioned files listed in latest.yml.)
          mkdir -p fixed && cd fixed
          gh release download "v$V" --repo "$GITHUB_REPOSITORY" -p "Strand-Setup-$V.exe" -p "Strand-$V.apk" -p "latest.yml" || true
          if [ ! -f "Strand-Setup-$V.exe" ] || [ ! -f latest.yml ]; then
            echo "::error::The Windows installer wasn't built, so this version isn't published."
            exit 1
          fi
          mv "Strand-Setup-$V.exe" Strand-Setup.exe
          gh release upload "v$V" Strand-Setup.exe --clobber --repo "$GITHUB_REPOSITORY"
          if [ -f "Strand-$V.apk" ]; then mv "Strand-$V.apk" Strand.apk; gh release upload "v$V" Strand.apk --clobber --repo "$GITHUB_REPOSITORY"; fi
          gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --draft=false --latest
