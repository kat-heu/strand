name: Build desktop apps

# Builds Windows (.exe), macOS (.dmg) and Linux (.AppImage) installers and
# publishes them as a GitHub Release named after the version in package.json.
#
# Runs on every push to main, but only builds when that version has no
# published release yet. To ship a new version, bump "version" in
# package.json and push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          DRAFT=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "false" ]; then
            echo "v$V is already released — nothing to build."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          if [ "$DRAFT" = "none" ]; then
            # Create the draft once, so the three parallel builds upload into the same release.
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Strand $V" --notes-file - <<'NOTES'
          ## Download

          | System | File |
          |---|---|
          | **Windows** | `Strand-Setup-*.exe` |
          | **macOS** | `Strand-*.dmg` |
          | **Linux** | `Strand-*.AppImage` |
          | **Android** | `Strand-*.apk` |

          These builds aren't code-signed yet, so the first launch shows a warning:
          - **Windows:** "Windows protected your PC" → **More info** → **Run anyway**.
          - **macOS:** right-click the app → **Open** → **Open**.
          - **Linux:** make the AppImage executable (`chmod +x`), then run it.
          - **Android:** open the .apk on your phone and allow "Install unknown apps" for your browser when asked.

          **iPhone:** open https://kat-heu.github.io/strand/strand.mobileconfig in Safari → **Allow**, then Settings app → **Profile Downloaded** → **Install**.

          Full-length Spotify and Apple Music playback in the desktop app needs the Widevine-enabled Electron build (see README). YouTube, SoundCloud and previews work out of the box.
          NOTES
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Build installers and upload to the release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds; add signing certificates later
      - uses: actions/upload-artifact@v4
        with:
          name: strand-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: ignore

  android:
    needs: check
    if: needs.check.outputs.needed == 'true'
    uses: ./.github/workflows/android.yml
    with:
      release: v${{ needs.check.outputs.version }}
    secrets: inherit

  publish:
    needs: [check, build, android]
    # Desktop updates go out even if the Android build has a problem.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.check.outputs.version }}"
          # Fixed-name copies, so the README's download links always get the newest version.
          # (The auto-updater keeps using the versioned files listed in latest.yml.)
          mkdir -p fixed && cd fixed
          gh release download "v$V" --repo "$GITHUB_REPOSITORY" -p "Strand-Setup-$V.exe" -p "Strand-$V.apk" || true
          [ -f "Strand-Setup-$V.exe" ] && mv "Strand-Setup-$V.exe" Strand-Setup.exe
          [ -f "Strand-$V.apk" ] && mv "Strand-$V.apk" Strand.apk
          ls -la
          for f in Strand-Setup.exe Strand.apk; do [ -f "$f" ] && gh release upload "v$V" "$f" --clobber --repo "$GITHUB_REPOSITORY"; done
          gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --draft=false --latest
