// Strand for Android: a thin shell that opens the Strand web app
// (https://kat-heu.github.io/strand/) full-screen in Chrome as a
// Trusted Web Activity. The app itself lives on the web, so it updates
// whenever the website does — no new APK needed.
plugins { id 'com.android.application' }

def webHost = 'kat-heu.github.io'
// Bump android/shell-version only when this Android app itself changes; Strand then
// tells people with an older copy to download the new one.
def shellVersion = file('../shell-version').text.trim()
def webUrl  = 'https://kat-heu.github.io/strand/'
def launchUrl = webUrl + '?app=android&shell=' + shellVersion

android {
    namespace 'app.strand.player'
    compileSdk 34

    defaultConfig {
        applicationId 'app.strand.player'
        minSdk 21
        targetSdk 34
        versionCode = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName = (System.getenv('VERSION_NAME') ?: '0.0.0')

        manifestPlaceholders = [hostName: webHost, defaultUrl: launchUrl]
        resValue 'string', 'app_name', 'Strand'
        resValue 'string', 'asset_statements',
            "[{ \"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": { \"namespace\": \"web\", \"site\": \"https://${webHost}\" } }]"
    }

    signingConfigs {
        release {
            def pass = System.getenv('KEYSTORE_PASSWORD') ?: ''
            storeFile = file(System.getenv('KEYSTORE_FILE') ?: 'strand.keystore')
            storePassword = pass
            keyAlias = (System.getenv('KEY_ALIAS') ?: 'strand')
            keyPassword = (System.getenv('KEY_PASSWORD') ?: pass)
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
